name: quality

on:
  push:
  pull_request:

jobs:
  windows-quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --prod --audit-level high
      - uses: android-actions/setup-android@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3
      - run: pnpm android:check

  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auto_monitor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/auto_monitor_ci
    steps:
      - uses: actions/checkout@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:deploy
      - run: pnpm db:verify:olx-reset

  dashboard-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auto_monitor_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/auto_monitor_e2e
      REDIS_URL: redis://127.0.0.1:6379
      LOCAL_API_TOKEN: ci-local-api-token-that-is-not-used-outside-ci
      DASHBOARD_AUTH_SECRET: ci-dashboard-auth-secret-that-is-at-least-32-chars
      DASHBOARD_SEED_USERNAME: e2e-user
      DASHBOARD_SEED_PASSWORD: e2e-password-with-adequate-length
      E2E_DASHBOARD_USERNAME: e2e-user
      E2E_DASHBOARD_PASSWORD: e2e-password-with-adequate-length
      E2E_BASE_URL: http://127.0.0.1:3001
      TELEGRAM_CONTROL_BOT_ENABLED: "false"
      MOCK_SOURCE_ENABLED: "true"
      API_REQUIRE_LOCAL_TOKEN_FOR_ALL: "true"
    steps:
      - uses: actions/checkout@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:deploy
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm auth:seed
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start API and dashboard
        shell: bash
        run: |
          pnpm --filter @amb/api start > /tmp/amb-api.log 2>&1 &
          pnpm --filter @amb/dashboard start > /tmp/amb-dashboard.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3001/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/amb-api.log /tmp/amb-dashboard.log
          exit 1
      - run: pnpm exec playwright test

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: github/codeql-action/init@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66 # v3
        with:
          languages: javascript-typescript
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:deploy
      - uses: github/codeql-action/analyze@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66 # v3
