  - "packages/*"

overrides:
  "minimatch@9.0.9>brace-expansion": 2.1.2
  "minimatch@10.2.5>brace-expansion": 5.0.8
  "fast-uri@3.1.4": 3.1.6
  "fast-uri@4.1.1": 4.1.3
  find-my-way: 9.7.0
  nanoid@3.3.16: 3.3.18
  deepmerge-ts: 8.0.0
  postcss: 8.5.23
  shell-quote: 1.9.0
  sharp: 0.35.4
  valibot: 1.4.2
  hono: 4.12.25
  ioredis: 5.11.1
  mysql2: 3.24.3

onlyBuiltDependencies:
