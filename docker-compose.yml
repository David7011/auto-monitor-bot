services:
  postgres:
    image: postgres:17-alpine
    container_name: amb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: amb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the shell or a Docker-only env file}
      POSTGRES_DB: auto_monitor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - amb_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amb -d auto_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: amb-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - amb_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  amb_pg_data:
  amb_redis_data:
